<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Interfaces</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
            background: #f7f7f7;
        }

        h1 {
            color: #2c3e50;
        }

        #adapters {
            margin-top: 2em;
        }

        .adapter {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 6px #0001;
            padding: 1em;
            margin-bottom: 1em;
        }

        .error {
            color: #c0392b;
        }

        .loader {
            color: #888;
        }

        .devices-list {
            margin-top: 1em;
        }

        .device {
            background: #eef6fa;
            border-left: 4px solid #3498db;
            margin: 0.5em 0 0.5em 1.5em;
            padding: 0.7em 1em;
            border-radius: 4px;
            box-shadow: 0 1px 3px #0001;
        }

        .device.paired {
            background: #dbeafe;
            /* pale blue */
            border-left-color: #60a5fa;
        }

        .device.unpaired {
            background: #fef9c3;
            /* pale yellow */
            border-left-color: #fde047;
        }

        .device.trusted {
            background: #93c5fd;
            /* deeper blue */
            border-left-color: #2563eb;
        }

        .device.connected {
            background: #bbf7d0;
            /* pale green */
            border-left-color: #22c55e;
        }

        #audio-devices {
            margin-top: 1em;
        }

        .audio-device {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            margin: 0.5em 0;
            padding: 0.7em 1em;
            border-radius: 4px;
            box-shadow: 0 1px 3px #0001;
        }

        .audio-device.enabled {
            background: #dcfce7;
            border-left-color: #16a34a;
        }

        .audio-device.disabled {
            background: #fef2f2;
            border-left-color: #ef4444;
        }

        .btn-audio {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 0.3em 0.6em;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .btn-audio.remove {
            background: #ef4444;
        }

        .btn-audio:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <h1>Bluetooth Interfaces</h1>
    <div id="adapters">
        <span class="loader">Loading...</span>
    </div>
    
    <hr style="margin: 2em 0; border: none; border-top: 2px solid #3498db;">
    
    <h2 style="color: #2c3e50;">Audio Devices</h2>
    <div id="audio-devices">
        <span class="loader">Loading audio devices...</span>
    </div>
    <script>
        async function fetchAdapters() {
            const adaptersDiv = document.getElementById('adapters');
            adaptersDiv.innerHTML = '<span class="loader">Loading...</span>';
            let scanIntervals = window._scanIntervals || {};
            window._scanIntervals = scanIntervals;
            // Clear previous intervals
            Object.values(scanIntervals).forEach(clearInterval);
            scanIntervals = {};
            try {
                const resp = await fetch('/api/v1/bluetooth/adapters', { credentials: 'include' });
                if (!resp.ok) {
                    const err = await resp.json();
                    adaptersDiv.innerHTML = `<span class="error">Error: ${err.error || resp.statusText}</span>`;
                    return;
                }
                const data = await resp.json();
                if (!data.adapters || !data.adapters.length) {
                    adaptersDiv.innerHTML = '<span>No Bluetooth interface detected.</span>';
                    return;
                }
                adaptersDiv.innerHTML = '';
                for (const adapter of data.adapters) {
                    const div = document.createElement('div');
                    div.className = 'adapter';
                    const mac = adapter.address || adapter.Address || '';
                    // Scan/discoverable controls
                    div.innerHTML = `<b>Name:</b> ${adapter.name || adapter.address || 'Unknown'}<br><b>MAC:</b> ${mac}<br>
                        <span>Discoverable: <b style="color:${adapter.discoverable ? 'green' : 'red'}">${adapter.discoverable ? 'Yes' : 'No'}</b></span>
                        <button class="toggle-discoverable-btn" style="margin-left:0.5em;">Toggle</button>
                        <span>Scan: <b style="color:${adapter.discovering ? 'green' : 'red'}">${adapter.discovering ? 'Yes' : 'No'}</b></span>
                        <button class="toggle-discovering-btn" style="margin-left:0.5em;">Toggle</button>
                        <span class="scan-msg"></span>
                        <hr style="border:none;border-top:1px solid #d0d7de;margin:1em 0 0.5em 0;">
                        <div style="font-size:0.98em;color:#555;margin-bottom:0.5em;font-weight:bold;">Devices list</div>
                        <div class="devices-list"><span class="loader">Loading devices...</span></div>`;
                    adaptersDiv.appendChild(div);
                    // Toggle discoverable
                    const discoverableBtn = div.querySelector('.toggle-discoverable-btn');
                    discoverableBtn.onclick = async () => {
                        const msg = div.querySelector('.scan-msg');
                        msg.textContent = 'Updating...';
                        const resp = await fetch(`/api/v1/bluetooth/adapters/${mac}/discoverable`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ enable: !adapter.discoverable })
                        });
                        const res = await resp.json();
                        msg.textContent = resp.ok ? 'Discoverable updated!' : (res.error || 'Error');
                        if (resp.ok) setTimeout(fetchAdapters, 1000);
                    };
                    // Toggle discovering
                    const discoveringBtn = div.querySelector('.toggle-discovering-btn');
                    discoveringBtn.onclick = async () => {
                        const msg = div.querySelector('.scan-msg');
                        msg.textContent = 'Updating...';
                        const resp = await fetch(`/api/v1/bluetooth/adapters/${mac}/discovering`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ enable: !adapter.discovering })
                        });
                        const res = await resp.json();
                        msg.textContent = resp.ok ? 'Scan updated!' : (res.error || 'Error');
                        // Start or stop refresh depending on new state
                        if (resp.ok) {
                            if (!adapter.discovering) {
                                // Just activated scan, start interval
                                scanIntervals[mac] = setInterval(() => {
                                    fetchDevicesForAdapter(mac, div.querySelector('.devices-list'), div);
                                }, 1000);
                            } else {
                                // Just deactivated scan, clear interval
                                if (scanIntervals[mac]) {
                                    clearInterval(scanIntervals[mac]);
                                    delete scanIntervals[mac];
                                }
                            }
                            setTimeout(fetchAdapters, 1000);
                        }
                    };
                    fetchDevicesForAdapter(mac, div.querySelector('.devices-list'), div);
                    // Refresh devices if scan is active
                    if (adapter.discovering) {
                        scanIntervals[mac] = setInterval(() => {
                            fetchDevicesForAdapter(mac, div.querySelector('.devices-list'), div);
                        }, 1000);
                    }
                }
            } catch (e) {
                adaptersDiv.innerHTML = `<span class="error">Network error: ${e}</span>`;
            }
        }

        async function fetchDevicesForAdapter(adapterMac, container, adapterDiv) {
            container.innerHTML = '<span class="loader">Loading...</span>';
            try {
                // All devices
                const resp = await fetch(`/api/v1/bluetooth/adapters/${adapterMac}/devices`, { credentials: 'include' });
                if (!resp.ok) {
                    container.innerHTML = `<span class="error">Error: ${resp.statusText}</span>`;
                    return;
                }
                const data = await resp.json();
                // Trusted devices
                const trustedResp = await fetch(`/api/v1/bluetooth/adapters/${adapterMac}/devices/trusted`, { credentials: 'include' });
                let trustedSet = new Set();
                if (trustedResp.ok) {
                    const trustedData = await trustedResp.json();
                    if (trustedData.trusted_devices && trustedData.trusted_devices.length) {
                        trustedData.trusted_devices.forEach(td => {
                            const tmac = td.address || td.Address || '';
                            if (tmac) trustedSet.add(tmac);
                        });
                    }
                }
                // Audio devices
                const audioResp = await fetch(`/api/v1/bluetooth/audio-devices`, { credentials: 'include' });
                let audioSet = new Set();
                if (audioResp.ok) {
                    const audioData = await audioResp.json();
                    if (audioData && audioData.length) {
                        audioData.forEach(ad => {
                            if (ad.enabled && ad.mac) audioSet.add(ad.mac);
                        });
                    }
                }
                if (!data.devices || !data.devices.length) {
                    container.innerHTML = '<span>No device found.</span>';
                    return;
                }
                container.innerHTML = '';
                // Sort devices: paired first, then others
                const sortedDevices = [...data.devices].sort((a, b) => {
                    const aPaired = a.paired || a.Paired;
                    const bPaired = b.paired || b.Paired;
                    if (aPaired === bPaired) return 0;
                    return aPaired ? -1 : 1;
                });
                sortedDevices.forEach(device => {
                    const devDiv = document.createElement('div');
                    let classes = ['device'];
                    // Status logic
                    const isPaired = device.paired || device.Paired;
                    const isConnected = device.connected || device.Connected;
                    const isTrusted = trustedSet.has(device.address || device.Address || '');
                    const mac = device.address || device.Address || '';
                    const isAudio = audioSet.has(mac);
                    if (isConnected) {
                        classes.push('connected');
                    } else if (isTrusted) {
                        classes.push('trusted');
                    } else if (isPaired) {
                        classes.push('paired');
                    } else {
                        classes.push('unpaired');
                    }
                    devDiv.className = classes.join(' ');
                    devDiv.innerHTML = `<b>Name:</b> ${device.name || device.Name || mac || 'Unknown'}<br><b>MAC:</b> ${mac}<br>
                        <span>Paired: <b style="color:${isPaired ? 'green' : 'red'}">${isPaired ? 'Yes' : 'No'}</b></span>
                        <span style="margin-left:1em;">Connected: <b style="color:${isConnected ? 'green' : 'red'}">${isConnected ? 'Yes' : 'No'}</b></span>
                        <span style="margin-left:1em;">Trusted: <b style="color:${isTrusted ? 'green' : 'red'}">${isTrusted ? 'Yes' : 'No'}</b></span>
                        <span style="margin-left:1em;">Audio: <b style="color:${isAudio ? 'green' : 'red'}">${isAudio ? 'Yes' : 'No'}</b></span>
                        <span class="device-msg"></span>`;
                    // Add (Pair) button if not paired
                    if (!isPaired) {
                        const pairBtn = document.createElement('button');
                        pairBtn.textContent = 'Pair';
                        pairBtn.className = 'pair-device-btn';
                        pairBtn.style.marginLeft = '1em';
                        pairBtn.onclick = async (e) => {
                            e.stopPropagation();
                            const msg = devDiv.querySelector('.device-msg');
                            msg.textContent = 'Pairing...';
                            const resp = await fetch(`/api/v1/bluetooth/adapters/${adapterMac}/devices/${mac}/pair`, {
                                method: 'POST', credentials: 'include'
                            });
                            const res = await resp.json();
                            msg.textContent = resp.ok ? 'Pairing initiated!' : (res.error || 'Error');
                            if (resp.ok) setTimeout(() => fetchDevicesForAdapter(adapterMac, container, adapterDiv), 1500);
                        };
                        devDiv.appendChild(pairBtn);
                    }
                    // Add Trust button if paired and not trusted
                    if (isPaired && !isTrusted) {
                        const trustBtn = document.createElement('button');
                        trustBtn.textContent = 'Trust';
                        trustBtn.className = 'trust-device-btn';
                        trustBtn.style.marginLeft = '1em';
                        trustBtn.onclick = async (e) => {
                            e.stopPropagation();
                            const msg = devDiv.querySelector('.device-msg');
                            msg.textContent = 'Trusting...';
                            const resp = await fetch(`/api/v1/bluetooth/adapters/${adapterMac}/devices/${mac}/trust`, {
                                method: 'POST', credentials: 'include'
                            });
                            const res = await resp.json();
                            msg.textContent = resp.ok ? 'Device trusted!' : (res.error || 'Error');
                            if (resp.ok) setTimeout(() => fetchDevicesForAdapter(adapterMac, container, adapterDiv), 1000);
                        };
                        devDiv.appendChild(trustBtn);
                    }
                    // Add/Remove Audio button for paired devices
                    if (isPaired) {
                        const audioBtn = document.createElement('button');
                        audioBtn.textContent = isAudio ? 'Remove Audio' : 'Add Audio';
                        audioBtn.className = isAudio ? 'btn-audio remove' : 'btn-audio';
                        audioBtn.style.marginLeft = '1em';
                        audioBtn.onclick = async (e) => {
                            e.stopPropagation();
                            const msg = devDiv.querySelector('.device-msg');
                            msg.textContent = isAudio ? 'Removing from audio...' : 'Adding to audio...';
                            
                            const resp = await fetch(`/api/v1/bluetooth/audio-devices/${mac}`, {
                                method: isAudio ? 'DELETE' : 'PUT',
                                headers: isAudio ? {} : { 'Content-Type': 'application/json' },
                                credentials: 'include',
                                body: isAudio ? undefined : JSON.stringify({ enabled: true })
                            });
                            const res = await resp.json();
                            msg.textContent = resp.ok ? (isAudio ? 'Removed from audio!' : 'Added to audio!') : (res.error || 'Error');
                            if (resp.ok) {
                                setTimeout(() => {
                                    fetchDevicesForAdapter(adapterMac, container, adapterDiv);
                                    fetchAudioDevices();
                                }, 1000);
                            }
                        };
                        devDiv.appendChild(audioBtn);
                    }

                    // Only show delete button for paired devices
                    if (isPaired) {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'Delete';
                        deleteBtn.className = 'delete-device-btn';
                        deleteBtn.style.marginLeft = '1em';
                        deleteBtn.onclick = async (e) => {
                            e.stopPropagation();
                            if (!confirm('Are you sure you want to remove this device?')) return;
                            const msg = devDiv.querySelector('.device-msg');
                            msg.textContent = 'Removing...';
                            const resp = await fetch(`/api/v1/bluetooth/adapters/${adapterMac}/devices/${mac}`, {
                                method: 'DELETE', credentials: 'include'
                            });
                            const res = await resp.json();
                            msg.textContent = resp.ok ? 'Removed!' : (res.error || 'Error');
                            if (resp.ok) {
                                setTimeout(() => {
                                    fetchDevicesForAdapter(adapterMac, container, adapterDiv);
                                    fetchAudioDevices();
                                }, 1000);
                            }
                        };
                        devDiv.appendChild(deleteBtn);
                    }
                    container.appendChild(devDiv);
                });
            } catch (e) {
                container.innerHTML = `<span class="error">Network error: ${e}</span>`;
            }
        }

        async function fetchAudioDevices() {
            const audioDiv = document.getElementById('audio-devices');
            audioDiv.innerHTML = '<span class="loader">Loading audio devices...</span>';
            
            try {
                const resp = await fetch('/api/v1/bluetooth/audio-devices', { credentials: 'include' });
                if (!resp.ok) {
                    const err = await resp.json();
                    audioDiv.innerHTML = `<span class="error">Error: ${err.error || resp.statusText}</span>`;
                    return;
                }
                
                const data = await resp.json();
                if (!data || !data.length) {
                    audioDiv.innerHTML = '<span>No audio devices configured.</span>';
                    return;
                }
                
                audioDiv.innerHTML = '';
                data.forEach(audioDevice => {
                    const devDiv = document.createElement('div');
                    devDiv.className = `audio-device ${audioDevice.enabled ? 'enabled' : 'disabled'}`;
                    
                    devDiv.innerHTML = `
                        <b>MAC:</b> ${audioDevice.mac}<br>
                        <span>Status: <b style="color:${audioDevice.enabled ? 'green' : 'red'}">${audioDevice.enabled ? 'Enabled' : 'Disabled'}</b></span>
                        <span class="audio-msg"></span>
                    `;
                    
                    // Toggle button
                    const toggleBtn = document.createElement('button');
                    toggleBtn.textContent = audioDevice.enabled ? 'Disable' : 'Enable';
                    toggleBtn.className = audioDevice.enabled ? 'btn-audio remove' : 'btn-audio';
                    toggleBtn.style.marginLeft = '1em';
                    toggleBtn.onclick = async (e) => {
                        e.stopPropagation();
                        const msg = devDiv.querySelector('.audio-msg');
                        msg.textContent = audioDevice.enabled ? 'Disabling...' : 'Enabling...';
                        
                        const resp = await fetch(`/api/v1/bluetooth/audio-devices/${audioDevice.mac}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ enabled: !audioDevice.enabled })
                        });
                        const res = await resp.json();
                        msg.textContent = resp.ok ? (audioDevice.enabled ? 'Disabled!' : 'Enabled!') : (res.error || 'Error');
                        if (resp.ok) {
                            setTimeout(() => {
                                fetchAudioDevices();
                                fetchAdapters(); // Refresh adapters to update audio status
                            }, 1000);
                        }
                    };
                    devDiv.appendChild(toggleBtn);
                    
                    // Remove button
                    const removeBtn = document.createElement('button');
                    removeBtn.textContent = 'Remove';
                    removeBtn.className = 'btn-audio remove';
                    removeBtn.style.marginLeft = '0.5em';
                    removeBtn.onclick = async (e) => {
                        e.stopPropagation();
                        if (!confirm('Are you sure you want to remove this audio device?')) return;
                        
                        const msg = devDiv.querySelector('.audio-msg');
                        msg.textContent = 'Removing...';
                        
                        const resp = await fetch(`/api/v1/bluetooth/audio-devices/${audioDevice.mac}`, {
                            method: 'DELETE',
                            credentials: 'include'
                        });
                        const res = await resp.json();
                        msg.textContent = resp.ok ? 'Removed!' : (res.error || 'Error');
                        if (resp.ok) {
                            setTimeout(() => {
                                fetchAudioDevices();
                                fetchAdapters(); // Refresh adapters to update audio status
                            }, 1000);
                        }
                    };
                    devDiv.appendChild(removeBtn);
                    
                    audioDiv.appendChild(devDiv);
                });
            } catch (e) {
                audioDiv.innerHTML = `<span class="error">Network error: ${e}</span>`;
            }
        }

        // Initialize page
        fetchAdapters();
        fetchAudioDevices();
    </script>
</body>

</html>
